# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  # Dispara em push na branch principal (ajuste se usar 'master')
  push:
    branches: ["atividade-quatro"]
  # Permite executar manualmente
  workflow_dispatch:

# Permite que o GitHub Pages acesse o resultado
permissions:
  contents: read
  pages: write
  id-token: write

# Permite fazer deploy em qualquer branch
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: node build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4